# [yayin hatti] release kirmizi biterse BIR kez kendiliginden yeniden denenir - yalniz dusen job'lar ("Re-run failed jobs"):
# runner'da tesadufen dusen bir test yayini durdurmasin. Ikinci deneme de kirmiziysa durur; gercek hata insan ister (SKILL adim 6).
# Ilk denemenin hatasi kosunun gecmisinde kalir: kararsiz test bulunup LocalOnly'ye alinir (CLAUDE.md). workflow_run yalniz
# varsayilan branch'teki (main) workflow dosyasiyla tetiklenir - main her yayinla develop'un tamamini alir.
name: release-retry
on:
  workflow_run:
    workflows: [release]
    types: [completed]
# Yalniz kosuyu yeniden baslatma izni; repoya yazmaz.
permissions:
  actions: write
jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: windows-2025
    steps:
      - run: gh run rerun ${{ github.event.workflow_run.id }} --failed --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
