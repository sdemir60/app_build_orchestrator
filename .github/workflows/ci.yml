name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  engine-tests:
    name: Engine build & tests (cross-platform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build engine projects
        run: |
          dotnet build src/BuildOrchestrator.Contracts/BuildOrchestrator.Contracts.csproj -c Release
          dotnet build src/BuildOrchestrator.Core/BuildOrchestrator.Core.csproj -c Release
          dotnet build src/BuildOrchestrator.Worker/BuildOrchestrator.Worker.csproj -c Release
      - name: Test
        run: |
          dotnet test tests/BuildOrchestrator.Core.Tests/BuildOrchestrator.Core.Tests.csproj -c Release
          dotnet test tests/BuildOrchestrator.Worker.Tests/BuildOrchestrator.Worker.Tests.csproj -c Release

  app-build:
    name: Full solution build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build solution
        run: dotnet build BuildOrchestrator.sln -c Release
