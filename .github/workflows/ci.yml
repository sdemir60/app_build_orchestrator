# [yayin hatti] main disindaki her branch'e her push'ta ve PR'da build + filtreli tam suit. Yayin yapmaz. Calisma branch'i
# merge'den once push'lanir: tam suitin kapisi onun kosusudur (lokal tam suit makineyi kilitliyordu). develop'un kosusu merge'den
# sonra birlesik hali dogrular; develop HEAD'inin bu kosusu yesil degilse release.ps1 durur. main'e (yalniz surumler) push
# release.yml'i baslatir; main'in build ve testi onun ci job'idir - ayni isi workflow_call ile buradan alir (build/test adimlari
# iki yerde yazilmaz), bu yuzden ci main'de ayrica kosmaz.
name: ci
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
# CI repoya yazmaz: kendi push/pull_request kosularinda token izni repo ayarinin varsayilanindan gelir (yazma olabilir);
# workflow seviyesi okuma bunu sabitler. release.yml'den cagrildiginda cagiranin okuma iziniyle zaten kesisir.
permissions:
  contents: read
# Grup workflow adini da tasir: release.yml'den cagrildiginda github.* cagiranindir (workflow "release", ref main). Yalniz ref'ten
# kurulsaydi main'de elle tetiklenen bir ci kosusu yayinin testlerini iptal ederdi (iptal "cancelled" biter, release-retry
# yalniz "failure"da yeniden dener).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    runs-on: windows-2025   # pinli: windows-latest imaji zamanla degisir; MSBuild vswhere ile cozuldugu icin VS surumunden bagimsiz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build BuildOrchestrator.slnx -c Release
      - run: dotnet test tests/BuildOrchestrator.Tests/BuildOrchestrator.Tests.csproj -c Release --no-build --filter "Category!=Acceptance&Category!=LocalOnly" --logger "trx;LogFileName=tests.trx"
      # Dusen testleri tek bir hata notu yapar: adlari API'den kimliksiz okunur (log ve artifact giris ister).
      - if: failure()
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/ci-failed-tests.ps1 -Trx tests/BuildOrchestrator.Tests/TestResults/tests.trx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: tests/BuildOrchestrator.Tests/TestResults/*.trx
